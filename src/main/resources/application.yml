spring:
  application:
    name: social-media

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
    expiration: ${JWT_EXPIRATION:86400000}
  storage:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
  bootstrap:
    admin-full-name: ${ADMIN_FULL_NAME:System Admin}
    admin-email: ${ADMIN_EMAIL:codeuz91@gmail.com}
    admin-password: ${ADMIN_PASSWORD:12345}
